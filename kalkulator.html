<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalkulator Lucu</title>

    <style>
      /* ===== CSS: tampilan ===== */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffe4ef;
        font-family: "Trebuchet MS", Arial, sans-serif;
      }

      .kalkulator {
        width: 300px;
        padding: 20px;
        background: #fff;
        border: 4px solid #ff9fc4;
        border-radius: 28px;
        box-shadow: 0 8px 0 #ff9fc4;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        color: #e0558c;
      }

      /* Layar angka */
      #layar {
        background: #fff4f9;
        border: 3px dashed #ffb6d3;
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 16px;
        text-align: right;
        font-size: 32px;
        font-weight: bold;
        color: #7a3f5a;
        overflow-x: auto;
        white-space: nowrap;
      }

      /* Tombol 4 kolom */
      .tombol {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      button {
        padding: 14px 0;
        font-size: 20px;
        font-weight: bold;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        background: #e6e0ff;
        color: #5b4a99;
        box-shadow: 0 4px 0 #c9bff5;
      }

      button:active {
        transform: translateY(4px);
        box-shadow: none;
      }

      button.operator {
        background: #ffd3e4;
        color: #d03f7a;
        box-shadow: 0 4px 0 #ffb0cf;
      }

      button.hapus {
        background: #ffe9a8;
        color: #9a6b00;
        box-shadow: 0 4px 0 #f5d070;
      }

      button.hasil {
        background: #b8ecd0;
        color: #217a4d;
        box-shadow: 0 4px 0 #8fd9b2;
      }
    </style>
  </head>

  <body>
    <div class="kalkulator">
      <h1>Kalkulator</h1>
      <div id="layar">0</div>

      <div class="tombol">
        <button class="hapus" onclick="hapus()">C</button>
        <button class="operator" onclick="pilihOperator('/')">÷</button>
        <button class="operator" onclick="pilihOperator('*')">×</button>
        <button class="operator" onclick="pilihOperator('-')">−</button>

        <button onclick="tekanAngka('7')">7</button>
        <button onclick="tekanAngka('8')">8</button>
        <button onclick="tekanAngka('9')">9</button>
        <button class="operator" onclick="pilihOperator('+')">+</button>

        <button onclick="tekanAngka('4')">4</button>
        <button onclick="tekanAngka('5')">5</button>
        <button onclick="tekanAngka('6')">6</button>
        <button class="hasil" style="grid-row: span 2" onclick="hitung()">=</button>

        <button onclick="tekanAngka('1')">1</button>
        <button onclick="tekanAngka('2')">2</button>
        <button onclick="tekanAngka('3')">3</button>

        <button style="grid-column: span 2" onclick="tekanAngka('0')">0</button>
        <button onclick="tekanAngka('.')">.</button>
      </div>
    </div>

    <script>
      // ===== Variabel =====
      let layar = document.getElementById("layar");
      let angka = ""; // angka yang sedang diketik
      let angkaPertama = 0; // angka sebelum operator
      let operator = ""; // + - * /

      // Tombol angka: tambahkan angka ke layar
      function tekanAngka(n) {
        angka = angka + n;
        layar.innerHTML = angka;
      }

      // Tombol operator: simpan angka pertama dan operatornya
      function pilihOperator(op) {
        angkaPertama = Number(angka);
        operator = op;
        angka = "";
      }

      // Tombol sama dengan: hitung hasilnya
      function hitung() {
        let angkaKedua = Number(angka);
        let hasil = 0;

        if (operator === "+") {
          hasil = angkaPertama + angkaKedua;
        } else if (operator === "-") {
          hasil = angkaPertama - angkaKedua;
        } else if (operator === "*") {
          hasil = angkaPertama * angkaKedua;
        } else if (operator === "/") {
          hasil = angkaPertama / angkaKedua;
        }

        layar.innerHTML = hasil;
        angka = "";
        operator = "";
      }

      // Tombol C: kembali ke awal
      function hapus() {
        angka = "";
        angkaPertama = 0;
        operator = "";
        layar.innerHTML = "0";
      }
    </script>
  </body>
</html>
